name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx wrangler types && npx tsc --noEmit

  # Production: main deploys itself once the tests pass, database migrations first. Needs two repo secrets,
  # CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template plus D1 edit) and CLOUDFLARE_ACCOUNT_ID; until the token
  # exists, these steps are skipped.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts # the token is in this job's environment: no install scripts
      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply fantasy-recap --remote
      - name: Deploy to thebenchpress.app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
