name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest the engine supports
      - run: pip install . # installed, not run from the checkout, so a missing template or prompt fails here
      - run: python tests/test_engine.py
